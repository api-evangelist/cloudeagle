specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CloudEagle.ai
providerId: cloudeagle
created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: >-
  https://www.cloudeagle.ai/llms.txt (70+ pages, none of them an API reference) +
  live probes of https://api.cloudeagle.ai/ and https://mcp.cloudeagle.ai/mcp
description: >-
  CloudEagle publishes NO rate limits. There is no public API reference, so there
  is no documented quota, window, burst or throttling behaviour to record — and
  no rate-limit response headers were observed on any live response from either
  the REST host or the MCP host.
limit_count: 0
limits: []

headers:
  observed: []
  documented: []
  note: >-
    No RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset (RFC 9331 style),
    no X-RateLimit-* and no Retry-After header was returned on any probed
    response from api.cloudeagle.ai or mcp.cloudeagle.ai. An agent has no runtime
    signal to back off on.

responseCodes:
  throttled: unknown
  note: The status code returned on exhaustion is not documented and was not observed.

probes:
- url: https://api.cloudeagle.ai/
  http_status: 401
  rate_limit_headers: none
  fetched: '2026-09-05'
- url: https://mcp.cloudeagle.ai/mcp
  http_status: 401
  method: POST tools/list
  rate_limit_headers: none
  fetched: '2026-09-05'

replaces:
  previous_method: generated
  previous_note: >-
    REPLACED a 2026-05-04 bulk-sweep scaffold that asserted a full
    X-RateLimit-*/Retry-After/RateLimit-Policy header set, 429/503 semantics and
    per-tier limits. CloudEagle returns none of those headers and publishes none
    of those limits; the scaffold was fabricated and has been removed. An honest
    zero is the correct record.

