capabilities:
  - id: cloudeagle.discover-saas-applications
    name: Discover SaaS and AI applications in use
    description: >-
      Automatically inventory the SaaS and AI applications in use
      across the organization, including shadow IT and shadow AI tools,
      using direct integrations with SSO, finance, HRIS, and CASB
      systems.
    apis:
      - cloudeagle:cloudeagle-api
  - id: cloudeagle.manage-licenses
    name: Manage SaaS licenses and usage
    description: >-
      Track license types, assigned and active users, login activity,
      and per-license spend so unused licenses can be harvested and
      contracts right-sized.
    apis:
      - cloudeagle:cloudeagle-api
  - id: cloudeagle.govern-access
    name: Govern user access and permissions
    description: >-
      Continuously monitor privileged users, high-risk permissions,
      and policy violations across SaaS apps; automate access reviews
      with audit-ready evidence.
    apis:
      - cloudeagle:cloudeagle-api
  - id: cloudeagle.automate-onboarding-offboarding
    name: Automate onboarding and offboarding
    description: >-
      Provision and deprovision SaaS app access tied to HRIS and IdP
      lifecycle events, with self-service catalog requests routed
      through approval workflows.
    apis:
      - cloudeagle:cloudeagle-api
  - id: cloudeagle.optimize-renewals-procurement
    name: Optimize renewals and procurement
    description: >-
      Surface upcoming renewals, benchmark prices, and orchestrate
      procurement workflows for SaaS purchases and renewals across
      the organization.
    apis:
      - cloudeagle:cloudeagle-api
  - id: cloudeagle.detect-shadow-ai
    name: Detect and govern shadow AI
    description: >-
      Identify AI tools in use, classify their risk, and apply
      governance policies covering data exposure, vendor risk, and
      compliance for AI applications.
    apis:
      - cloudeagle:cloudeagle-api
