        type: Documentation
      - url: authentication/cloudeagle-authentication.yml
        type: Authentication
      - url: conventions/cloudeagle-conventions.yml
        type: Conventions
      - url: errors/cloudeagle-problem-types.yml
        type: ErrorCatalog
    description: >-
      The CloudEagle API is an enterprise REST surface that exposes the
      same SaaS-management primitives as the web app: discovered
      applications, licenses and usage, identity and access state,
      onboarding/offboarding workflows, vendor and contract records,
      and procurement workflows. CloudEagle does not publish a fully
      open developer portal; access to API specifications and
      credentials is provisioned to customer tenants and partners via
      account-level settings, and integration documentation is shared
      directly with onboarded customers.
  - aid: cloudeagle:cloudeagle-mcp
    name: CloudEagle.ai MCP Server
    tags:
      - Access Governance
      - License Management
      - SaaS Management
      - Shadow AI
      - Vendor Management
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.cloudeagle.ai/blogs/mcp-server-saas-ai-identity-insights
    baseURL: https://mcp.cloudeagle.ai
    properties:
      - url: mcp/cloudeagle-mcp.yml
        type: MCPServer
      - url: authentication/cloudeagle-authentication.yml
        type: Authentication
      - url: well-known/cloudeagle-well-known.yml
        type: WellKnown
      - url: https://www.cloudeagle.ai/blogs/mcp-server-saas-ai-identity-insights
        type: Documentation
    description: >-
      A live, OAuth-protected Model Context Protocol server CloudEagle serves
      from its own hostname mcp.cloudeagle.ai, letting IT, security, finance and
      procurement teams query their live SaaS, AI-application, licence, contract
      and identity data from Claude, ChatGPT, Gemini or Copilot. It is a remote
      endpoint — an MCP client connects over the network after an OAuth 2.0
      authorization-code + PKCE flow with dynamic client registration; there is
      no package to install. Access is scoped to a single CloudEagle tenant,
      chosen by subdomain at the consent step. The tool list is auth-gated and
      has not been enumerated; CloudEagle publishes no tool reference.
