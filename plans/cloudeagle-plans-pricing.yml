created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: https://www.cloudeagle.ai/pricing
description: >-
  CloudEagle publishes NO prices. https://www.cloudeagle.ai/pricing (HTTP 200,
  fetched 2026-09-05) is a module chooser: five product modules, each listing
  included capabilities and ending in a "Book a Personalized Demo" call to
  action. No plan names, no per-seat or per-app rates, no currency, no billing
  period, no quotas and no overage terms appear anywhere on the page. There is
  no API-specific plan or metered API tier of any kind.
plan_count: 0
plans: []

replaces:
  previous_method: generated
  previous_note: >-
    REPLACED a 2026-05-04 bulk-sweep scaffold that invented three tiers
    ("Free / Pro / Enterprise") with invented quotas (1,000 requests/month,
    10 requests/minute, a 1,000 rpm enterprise rate). None of those numbers came
    from CloudEagle and none of them is real. A searched zero is the correct
    record; the scaffold was fabricated content and has been removed.

