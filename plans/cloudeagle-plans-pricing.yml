    http_status: 200
  - name: Microsoft Azure Marketplace
    url: https://azuremarketplace.microsoft.com/en-US/marketplace/apps/cloudeagle.cloudeagle
    http_status: 200

discrepancy:
  note: >-
    https://www.cloudeagle.ai/llms.txt describes the pricing page as "Transparent
    flat pricing with no custom development required". The page it points at
    contains no price at all. Recorded because it is a machine-readable claim
    CloudEagle makes about itself that its own page does not support.

