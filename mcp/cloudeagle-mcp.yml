notes:
- >-
  This is a REMOTE endpoint, not a stdio package. An agent can reach it today
  over the network after an OAuth authorization-code + PKCE flow; nothing has to
  be installed on a machine first. Both facts were established by probe.
- >-
  The server supports RFC 7591 dynamic client registration with public clients
  (token_endpoint_auth_methods ["none"]), which is what lets an arbitrary MCP
  client connect without a pre-provisioned client_id. That is a deliberate,
  agent-friendly choice.
- >-
  The MCP server is undiscoverable from CloudEagle's own machine-readable
  surface: mcp.cloudeagle.ai appears nowhere in https://www.cloudeagle.ai/llms.txt,
  which otherwise lists 70+ pages. It was found by hostname probing and confirmed
  against the launch blog post.

